<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="drop-shadow(0px 8px 16px rgba(79, 70, 229, 0.4))" />
  
  <!-- Subtle Inner Border -->
  <rect x="3" y="3" width="58" height="58" rx="15" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
  
  <!-- Terminal Prompt > -->
  <path d="M18 22 L30 32 L18 42" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Cursor Line _ -->
  <path d="M34 42 L46 42" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- AI Sparkle Top Right -->
  <path d="M46 16 L47.5 21 L52.5 22.5 L47.5 24 L46 29 L44.5 24 L39.5 22.5 L44.5 21 Z" fill="#fbbf24" filter="url(#glow)" />
</svg>
